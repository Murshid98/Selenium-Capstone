# ============================================================
# Configuration File for SauceDemo Test Automation Framework
# ============================================================
# This file contains all configurable values for the framework
# including browser settings, URLs, credentials, and wait times.
# Values should NOT be hard-coded in test or page classes.
# ============================================================

# ============ BROWSER CONFIGURATION ============
# Browser type: chrome, firefox, edge, safari
browser=chrome

# Headless mode: true (faster, no UI) or false (headed, visual feedback)
# Headless mode runs 2-3x faster, recommended for CI/CD pipelines
# Headed mode is recommended for debugging and visual verification
headless.mode=false

# Base URL for the application under test
base.url=https://www.saucedemo.com

# ============ EXPLICIT WAIT CONFIGURATION ============
# Implicit wait time in seconds - applied globally
implicit.wait=10

# Explicit wait time for WebDriverWait in seconds
explicit.wait=15

# Page load timeout in seconds
page.load.timeout=20

# ============ TEST CREDENTIALS ============
# Valid user credentials for positive test scenarios
valid.username=standard_user
valid.password=secret_sauce

# Invalid credentials for negative test scenarios
invalid.username=invalid_user
invalid.password=wrong_password

# Locked-out user credentials
locked.username=locked_out_user
locked.password=secret_sauce

# ============ SCREENSHOT & REPORTING ============
# Directory where screenshots will be saved on test failure
screenshot.path=./test-results/screenshots/

# Extent Report output directory
report.path=./test-results/reports/

# Report file name
report.file=ExtentReport.html

# ============ LOGGING ============
# Log file path
log.file.path=./test-results/logs/

# Log level: DEBUG, INFO, WARN, ERROR
log.level=INFO
